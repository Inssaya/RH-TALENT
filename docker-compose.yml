# TalentMatch production stack. Copy .env.example to .env, fill it, then: docker compose up -d --build
x-backend: &backend
  build:
    context: .
    dockerfile: backend/Dockerfile
  env_file: .env
  environment:
    ENV: production
    DATABASE_URL: postgresql+psycopg://talentmatch:${POSTGRES_PASSWORD}@db:5432/talentmatch
    REDIS_URL: redis://redis:6379/0
    STORAGE_DIR: /data/storage
    CLAMAV_HOST: ${CLAMAV_HOST:-}
  volumes:
    - storage:/data/storage
  depends_on:
    db: { condition: service_healthy }
    redis: { condition: service_healthy }
  restart: unless-stopped

services:
  caddy:
    image: caddy:2-alpine
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [web, api]
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${PUBLIC_URL:-http://localhost}
    environment:
      API_INTERNAL_URL: http://api:8000
    depends_on: [api]
    restart: unless-stopped

  api:
    <<: *backend
    environment:
      ENV: production
      DATABASE_URL: postgresql+psycopg://talentmatch:${POSTGRES_PASSWORD}@db:5432/talentmatch
      REDIS_URL: redis://redis:6379/0
      STORAGE_DIR: /data/storage
      CLAMAV_HOST: ${CLAMAV_HOST:-}
      RUN_MIGRATIONS: "1"

  worker:
    <<: *backend
    command: ["celery", "-A", "app.tasks:celery", "worker", "-Q", "scoring,low", "-c", "2", "--loglevel", "INFO"]
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.tasks:celery inspect ping -d celery@$$HOSTNAME || exit 1"]
      interval: 60s
      timeout: 15s
      retries: 3

  beat:
    <<: *backend
    command: ["celery", "-A", "app.tasks:celery", "beat", "--loglevel", "INFO", "-s", "/tmp/celerybeat-schedule"]

  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: talentmatch
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: talentmatch
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U talentmatch"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  clamav:
    image: clamav/clamav:stable
    profiles: ["antivirus"]
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  storage:
  caddy_data:
